[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "keep-rollin"
version = "0.1.0"
description = "Annualised risk/return metrics — Sharpe, Sortino, max drawdown — for multi-asset portfolios"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.0",
    "pyarrow>=14.0",
    "yfinance>=0.2",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "httpx>=0.27",
]
api = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
]

# Streamlit is a dependency group rather than an optional extra because the
# deployment host runs a bare `uv sync` against uv.lock. Extras are opt-in and
# would be skipped; a default group is installed. See
# docs/decisions/0015-install-streamlit-as-a-default-dependency-group.md
[dependency-groups]
app = ["streamlit>=1.30"]

[tool.uv]
default-groups = ["app"]

[project.scripts]
rollin = "keep_rollin.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/keep_rollin"]

[tool.ruff.lint]
# Selected explicitly rather than inheriting ruff's defaults. Those defaults
# widen between releases, so an unpinned linter can turn CI red on code nobody
# touched — which is exactly what a ruff 0.15 -> 0.16 bump did here. With this
# list, adopting a new rule family is a deliberate edit.
select = [
    "E4",   # pycodestyle: imports
    "E7",   # pycodestyle: statements
    "E9",   # pycodestyle: runtime errors
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "RUF",  # ruff-specific
]
ignore = [
    # `a + [b]` reads fine here and the unpacking form is not clearly better,
    # especially in tests where the concatenation mirrors the request shape.
    "RUF005",
    # The refresh script prints "rows x columns" with a multiplication sign on
    # purpose; it is output, not an identifier.
    "RUF001",
]

# Selecting a family means new rules *within* it arrive with a ruff upgrade.
# That is the deliberate trade: families are pinned here, individual rules are
# not, so an upgrade can still surface new findings — just never a whole new
# category nobody opted into.

[tool.ruff.lint.pydocstyle]
# Docstrings follow NumPy style: sectioned with Parameters/Returns/Notes under
# dashed underlines. The pydocstyle (D) rules are deliberately not enabled —
# short helpers such as daily_returns(prices) read better with a one-liner
# than with a Parameters block. This records the convention for the sections
# that are written.
convention = "numpy"

[tool.coverage.run]
# Everything the tests exercise, not just the importable package. The
# dashboard and the refresh script are both tested; measuring only
# src/keep_rollin reported a higher number over less code.
source = ["keep_rollin", "streamlit_app", "scripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
strict_optional = true
