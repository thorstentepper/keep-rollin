[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "keep-rollin"
version = "0.1.0"
description = "Annualised risk/return metrics — Sharpe, Sortino, max drawdown — for multi-asset portfolios"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.0",
    "yfinance>=0.2",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[project.scripts]
sharpe = "sharpe_ratio.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/sharpe_ratio"]

[tool.pytest.ini_options]
testpaths = ["tests"]
