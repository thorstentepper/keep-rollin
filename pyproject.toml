[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "keep-rollin"
version = "0.1.0"
description = "Annualised risk/return metrics — Sharpe, Sortino, max drawdown — for multi-asset portfolios"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.0",
    "pyarrow>=14.0",
    "yfinance>=0.2",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "httpx>=0.27",
]
app = [
    "streamlit>=1.30",
]
api = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
]

[project.scripts]
rollin = "keep_rollin.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/keep_rollin"]

[tool.ruff.lint.pydocstyle]
# Docstrings follow NumPy style: sectioned with Parameters/Returns/Notes under
# dashed underlines. The pydocstyle (D) rules are deliberately not enabled —
# short helpers such as daily_returns(prices) read better with a one-liner
# than with a Parameters block. This records the convention for the sections
# that are written.
convention = "numpy"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
strict_optional = true
