[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "keep-rollin"
version = "0.1.0"
description = "Annualised risk/return metrics — Sharpe, Sortino, max drawdown — for multi-asset portfolios"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.0",
    "yfinance>=0.2",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
]
app = [
    "streamlit>=1.30",
]

[project.scripts]
rollin = "keep_rollin.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/keep_rollin"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
strict_optional = true
