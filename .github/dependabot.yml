# Dependabot opens pull requests for outdated dependencies. Each one is tested
# by the CI workflow before it can be merged, so a green check is evidence the
# bump is safe rather than a guess.
#
# Note: the tests mock the Yahoo Finance call, so a passing yfinance bump shows
# the code still runs — not that live behaviour is unchanged. See
# docs/decisions/0001-replace-static-csv-data-with-live-market-data.md.
version: 2

updates:
  # The workflow pins three actions; without this they quietly rot. They are
  # already running on a deprecated Node runtime.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "ci"

  # Python dependencies and the lockfile. If Dependabot reports this ecosystem
  # as unsupported, change it to "pip", which reads pyproject.toml but leaves
  # uv.lock alone.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
    # One grouped pull request per month rather than one per package: on a
    # solo repository, per-package noise is what makes the whole thing get
    # ignored.
    groups:
      python-dependencies:
        patterns: ["*"]
