name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: false

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --extra dev --python ${{ matrix.python-version }}

      - name: Lint with ruff
        run: uv run --python ${{ matrix.python-version }} ruff check src tests app.py

      - name: Check formatting with ruff
        run: uv run --python ${{ matrix.python-version }} ruff format --check src tests app.py

      - name: Type check with mypy
        run: uv run --python ${{ matrix.python-version }} mypy src

      - name: Run tests
        run: uv run --python ${{ matrix.python-version }} pytest --cov=keep_rollin --cov-report=xml --cov-report=term-missing

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false
